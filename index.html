<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Logo</title>

  <!-- model-viewer -->
  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      background-color: transparent;
    }
  </style>
</head>
<body>

<model-viewer
  src="./logo.glb"
  auto-rotate
  rotation-per-second="20deg"
  camera-controls
  interaction-prompt="none"
  shadow-intensity="0.4"
  exposure="1.1"
  environment-image="neutral"
  style="--poster-color: transparent;">
</model-viewer>

</body>
</html>
