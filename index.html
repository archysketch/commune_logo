<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>3D Logo</title>

  <!-- model-viewer -->
  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    /* Logo container */
    #logo-wrapper {
      position: fixed;
      top: 16px;
      left: 16px;
      width: 90px;   /* Bubble’daki logo boyutu */
      height: 90px;
      pointer-events: none; /* TIKLAMA ENGELLEMEZ */
      z-index: 10;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background: transparent;
      --poster-color: transparent;
      pointer-events: none; /* kullanıcı sürükleyemesin */
    }
  </style>
</head>
<body>

<div id="logo-wrapper">
  <model-viewer
    id="logo"
    src="./logoglass.glb"

    auto-rotate
    rotation-per-second="10deg"
    auto-rotate-delay="0"

    interaction-prompt="none"
    camera-controls="false"

    exposure="1.35"
    shadow-intensity="0.12"
    shadow-softness="0.6"
    tone-mapping="neutral"

    environment-image="https://modelviewer.dev/shared-assets/environments/aircraft_workshop_01_1k.hdr"

    camera-orbit="0deg 75deg 2.8m">
  </model-viewer>
</div>

<script>
  const viewer = document.getElementById('logo');

  let baseAngle = 0;
  let targetAngle = 0;
  let currentAngle = 0;

  window.addEventListener('mousemove', (e) => {
    const x = (e.clientX / window.innerWidth) - 0.5;
    const maxOffset = 18; // çok hafif premium hareket
    targetAngle = baseAngle + x * maxOffset;
  });

  function animate() {
    // smooth interpolation
    currentAngle += (targetAngle - currentAngle) * 0.08;
    viewer.cameraOrbit = `${currentAngle}deg 75deg 2.8m`;
    requestAnimationFrame(animate);
  }

  animate();
</script>

</body>
</html>
