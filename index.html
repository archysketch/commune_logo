<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Logo</title>

  <!-- model-viewer -->
  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background: transparent;
      --poster-color: transparent;
    }
  </style>
</head>
<body>

<model-viewer
  src="./logo.glb"

  auto-rotate
  rotation-per-second="10deg"
  auto-rotate-delay="800"

  camera-controls
  interaction-prompt="none"

  exposure="1.6"
  shadow-intensity="0.08"
  shadow-softness="0.8"

  tone-mapping="aces"

  environment-image="https://modelviewer.dev/shared-assets/environments/venice_sunset_1k.hdr"

  style="background-color: transparent;">
</model-viewer>

</body>
</html>
