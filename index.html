<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Logo</title>

  <!-- model-viewer -->
  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background-color: transparent;
      --poster-color: transparent;
      pointer-events: none; /* kullanıcı sürükleyemesin */
    }
  </style>
</head>
<body>

<model-viewer
  id="logo"
  src="./logoglass.glb"

  auto-rotate
  rotation-per-second="10deg"
  auto-rotate-delay="0"

  interaction-prompt="none"

  exposure="1.35"
  shadow-intensity="0.12"
  shadow-softness="0.6"

  tone-mapping="neutral"

  environment-image="https://modelviewer.dev/shared-assets/environments/aircraft_workshop_01_1k.hdr"

  camera-orbit="0deg 75deg 2.8m"
  style="background-color: transparent;">
</model-viewer>

<script>
  const viewer = document.getElementById('logo');

  // başlangıç açısı
  let baseAngle = 0;

  window.addEventListener('mousemove', (e) => {
    const x = (e.clientX / window.innerWidth) - 0.5;

    // 🔥 ETKİYİ ARTIRDIK
    const maxOffset = 45; // derece (20 → 45)

    // 🔁 YÖNÜ DÜZELTTİK (sağa mouse = sağa dönüş)
    const angle = baseAngle - x * maxOffset;

    // SADECE YATAY
    viewer.cameraOrbit = `${angle}deg 75deg 2.8m`;
  });
</script>

</body>
</html>
